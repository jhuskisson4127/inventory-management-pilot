services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory_dev
      MYSQL_ROOT_PASSWORD: inventory_root_dev
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://inventory:inventory_dev@db:3306/inventory?charset=utf8mb4}
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-postgresql+psycopg://inventory:inventory_dev@legacy-postgres:5432/inventory}
      CORS_ORIGINS: http://localhost:5173
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./backend:/app"]

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]

  legacy-postgres:
    image: postgres:16-alpine
    profiles: ["migration"]
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  postgres_data:
